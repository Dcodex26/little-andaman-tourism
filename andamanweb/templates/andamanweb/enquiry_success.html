<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry Submitted | Little Andaman Tourism</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .success-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .success-box {
            background: white;
            max-width: 650px;
            width: 100%;
            text-align: center;
            padding: 55px 40px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .check {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #176b5b;
            color: white;
            font-size: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #176b5b;
            margin-bottom: 15px;
            font-size: 36px;
        }

        p {
            color: #666;
            line-height: 1.7;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 14px 28px;
            background: #176b5b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #0f5145;
        }

        footer {
            background: #123c36;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        footer p {
            color: white;
            margin: 5px 0;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <section class="success-section">

        <div class="success-box">

            <div class="check">
                ✓
            </div>

            <h1>
                Thank You!
            </h1>

            <p>
                Your enquiry has been submitted successfully.
                We have received your message and will get back
                to you soon.
            </p>

            <a href="/" class="home-button">
                Back to Home
            </a>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Little Andaman Tourism
        </p>

        <p>
            Explore • Discover • Experience Little Andaman
        </p>

    </footer>

</body>

</html>
